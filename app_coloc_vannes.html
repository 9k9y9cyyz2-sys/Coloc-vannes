<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veille Coloc Vannes & Arradon</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/home.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --danger-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 100px 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            padding-top: 10px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .stat-card .lbl {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            padding-right: 10px;
        }

        .badge-yield {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
        }

        .badge-yield.warning {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-red);
            border-color: var(--danger-red);
        }

        .card-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .metric {
            text-align: center;
        }

        .metric-val {
            font-size: 14px;
            font-weight: 600;
        }

        .metric-lbl {
            font-size: 10px;
            color: var(--text-sub);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .location-tag {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-link {
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Nav Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            max-width: 500px;
            margin: 0 auto;
        }

        .bar-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .bar-btn.active {
            color: var(--accent-blue);
        }

        /* Modal Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-save {
            width: 100%;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏠 Veille Coloc Vannes</h1>
        <p class="subtitle">Annonces éligibles ≥ 6% de rendement net</p>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="val" id="stat-count">0</div>
            <div class="lbl">Biens ≥ 6%</div>
        </div>
        <div class="stat-card">
            <div class="val" id="stat-avg">0%</div>
            <div class="lbl">Rendement Moyen</div>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="tab active" onclick="filterList('all')">Tous</button>
        <button class="tab" onclick="filterList('Vannes')">Vannes</button>
        <button class="tab" onclick="filterList('Arradon')">Arradon</button>
    </div>

    <div class="card-list" id="annonces-container">
        <!-- Rempli en JS -->
    </div>

    <div class="bottom-bar">
        <button class="bar-btn active" onclick="switchView('feed')">
            <span>🔍</span>
            Annonces
        </button>
        <button class="bar-btn" onclick="openSettings()">
            <span>⚙️</span>
            Paramètres
        </button>
    </div>

    <!-- Modal Paramètres -->
    <div class="modal" id="modal-settings">
        <div class="modal-content">
            <h2 style="font-size: 18px; margin-bottom: 16px;">⚙️ Paramètres Financiers</h2>
            
            <div class="form-group">
                <label>Loyer estimé par chambre CC (€)</label>
                <input type="number" id="cfg-loyer" value="430">
            </div>

            <div class="form-group">
                <label>Frais de notaire estimation (%)</label>
                <input type="number" id="cfg-notaire" value="8">
            </div>

            <div class="form-group">
                <label>Seuil de rendement net minimum (%)</label>
                <input type="number" id="cfg-seuil" value="6.0" step="0.1">
            </div>

            <button class="btn-save" onclick="saveSettings()">Enregistrer & Recalculer</button>
        </div>
    </div>

    <script>
        // Données d'exemple simulant le flux scrapé automatiquement
        let annoncesData = [
            { id: 1, titre: "Maison 5 pièces 105m² - Quartier Tohannic / IUT", prix: 235000, surface: 105, chambres: 4, ville: "Vannes", url: "https://www.leboncoin.fr" },
            { id: 2, titre: "Maison récente 6 pièces - Proche commodités", prix: 280000, surface: 120, chambres: 5, ville: "Arradon", url: "https://www.seloger.com" },
            { id: 3, titre: "Appartement T4 lumineux 82m²", prix: 175000, surface: 82, chambres: 3, ville: "Vannes", url: "https://www.leboncoin.fr" },
            { id: 4, titre: "Maison de ville avec jardin - Gare / Université", prix: 260000, surface: 110, chambres: 5, ville: "Vannes", url: "https://www.ouestfrance-immo.com" }
        ];

        let config = {
            loyerChambre: 430,
            fraisNotaire: 0.08,
            seuilNet: 6.0
        };

        function calculerRendementNet(prix, chambres) {
            let loyerMensuel = chambres * config.loyerChambre;
            let loyerAnnuelBrut = loyerMensuel * 12;
            
            // Coût d'acquisition = Prix + Notaire (8%) + Ameublement (1500€/chambre)
            let coutAcquisition = prix * (1 + config.fraisNotaire) + (chambres * 1500);
            
            // Charges = Taxe foncière (~8%) + PNO (200€) + Copro (600€)
            let chargesAnnuelle = (loyerAnnuelBrut * 0.08) + 200 + 600;
            let loyerAnnuelNet = loyerAnnuelBrut - chargesAnnuelle;

            let rendementNet = (loyerAnnuelNet / coutAcquisition) * 100;
            return {
                net: rendementNet.toFixed(2),
                loyer: loyerMensuel
            };
        }

        function renderAnnonces(filterVille = 'all') {
            const container = document.getElementById('annonces-container');
            container.innerHTML = '';

            let totalYield = 0;
            let countEligible = 0;

            annoncesData.forEach(a => {
                if (filterVille !== 'all' && a.ville !== filterVille) return;

                let calc = calculerRendementNet(a.prix, a.chambres);
                let isEligible = parseFloat(calc.net) >= config.seuilNet;

                if (isEligible) {
                    countEligible++;
                    totalYield += parseFloat(calc.net);
                }

                let cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${a.titre}</div>
                            <div class="badge-yield ${isEligible ? '' : 'warning'}">
                                ${calc.net}% NET
                            </div>
                        </div>
                        <div class="card-metrics">
                            <div class="metric">
                                <div class="metric-val">${a.prix.toLocaleString()} €</div>
                                <div class="metric-lbl">Prix d'achat</div>
                            </div>
                            <div class="metric">
                                <div class="metric-val">${a.chambres}</div>
                                <div class="metric-lbl">Chambres</div>
                            </div>
                            <div class="metric">
                                <div class="metric-val" style="color: var(--accent-green);">${calc.loyer} €/m</div>
                                <div class="metric-lbl">Loyer Est.</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="location-tag">📍 ${a.ville} • ${a.surface} m²</div>
                            <a href="${a.url}" target="_blank" class="btn-link">Voir l'annonce ↗</a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            document.getElementById('stat-count').innerText = countEligible;
            document.getElementById('stat-avg').innerText = countEligible > 0 ? (totalYield / countEligible).toFixed(1) + '%' : '0%';
        }

        function filterList(ville) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderAnnonces(ville);
        }

        function openSettings() {
            document.getElementById('modal-settings').style.display = 'flex';
        }

        function saveSettings() {
            config.loyerChambre = parseFloat(document.getElementById('cfg-loyer').value) || 430;
            config.fraisNotaire = (parseFloat(document.getElementById('cfg-notaire').value) || 8) / 100;
            config.seuilNet = parseFloat(document.getElementById('cfg-seuil').value) || 6.0;

            document.getElementById('modal-settings').style.display = 'none';
            renderAnnonces();
        }

        // Init
        renderAnnonces();
    </script>
</body>
</html>
